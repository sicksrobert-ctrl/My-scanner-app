<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Route Router Pro (No-Permission Edition)</title>
    <!-- Include Direct Image Extraction Scanner Library -->
    <script src="https://unpkg.com"></script>
    <!-- Include Open-Source Mapping Libraries -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 12px; background: #f8fafc; }
        h2 { color: #0f172a; margin-top: 5px; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        #map { height: 280px; width: 100%; border-radius: 16px; margin-top: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .container { display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 16px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        button, .btn-orange { border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; transition: transform 0.1s; text-align: center; display: block; box-sizing: border-box; }
        button:active, .btn-orange:active { transform: scale(0.98); }
        .btn-blue { background: #2563eb; color: white; width: 100%; }
        .btn-orange { background: #ea580c; color: white; font-size: 16px; padding: 16px; width: 100%; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-decoration: none; }
        .btn-green { background: #16a34a; color: white; grid-column: span 2; width: 100%; }
        .btn-danger { background: #ef4444; color: white; width: 100%; }
        ul { padding-left: 0; margin: 10px 0; list-style-type: none; max-height: 180px; overflow-y: auto; }
        li { padding: 10px; background: #f1f5f9; border-radius: 8px; margin-bottom: 6px; font-size: 13px; color: #334155; display: flex; align-items: center; }
        .badge { background: #cbd5e1; color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 8px; font-weight: bold; }
        .status-banner { background: #f0fdf4; color: #16a34a; padding: 8px; border-radius: 8px; font-size: 12px; text-align: center; font-weight: bold; margin-bottom: 5px; border: 1px solid #bbf7d0; }
        
        /* The Hidden Catcher Element */
        #hidden-camera-input { display: none; }
        
        /* Loading spinner */
        #loading-wheel { display: none; text-align: center; font-size: 14px; color: #ea580c; font-weight: bold; padding: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Router & Barcode Optimizer</h2>
    <div class="status-banner">⚡ Zero-Permission Snapshot Engine Active</div>
    
    <!-- NATIVE HARDWARE TRIGGER LABEL LINK -->
    <label for="hidden-camera-input" class="btn-orange">📷 Take Barcode Photo</label>
    
    <!-- NATIVE CHANNEL INPUT - Bypasses Browser Privacy Blocks Completely -->
    <input type="file" id="hidden-camera-input" accept="image/*" capture="environment" onchange="extractBarcodeFromPhoto(event)">
    
    <div id="loading-wheel">⚙️ Processing image file layout...</div>

    <div class="card">
        <h3 style="margin-top:0; font-size: 16px; color: #1e293b;">Delivery Queue</h3>
        <ul id="address-list"></ul>
        
        <div class="grid-buttons">
            <button class="btn-blue" onclick="autoSortRoute()">Auto-Sort Stops</button>
            <button class="btn-danger" onclick="clearAllWaypoints()">Clear All</button>
            <button class="btn-green" onclick="exportToNativeMaps()">Launch Voice Turn-by-Turn</button>
        </div>
    </div>

    <!-- Hidden parsing div canvas needed by engine -->
    <div id="qr-reader-engine-canvas" style="display:none;"></div>
    <div id="map"></div>
</div>

<script>
    let waypoints = [];
    let map;
    let polylineRoute = null;
    let userLocation = null;
    let scannerEngine = null;

    function initMap() {
        map = L.map('map').setView([35.222, -101.831], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userLocation = { lat: position.coords.latitude, lon: position.coords.longitude };
                map.setView([userLocation.lat, userLocation.lon], 13);
                L.marker([userLocation.lat, userLocation.lon], {
                    icon: L.divIcon({className: 'user-icon', html: '📍', iconSize:})
                }).addTo(map).bindPopup("Starting Position").openPopup();
                loadSavedWaypoints();
            }, () => { loadSavedWaypoints(); });
        } else {
            loadSavedWaypoints();
        }
    }
    initMap();

    // FAIL-SAFE EXTRACTION ROUTINE
    function extractBarcodeFromPhoto(event) {
        const fileList = event.target.files;
        if (fileList.length === 0) return;
        
        document.getElementById("loading-wheel").style.display = "block";
        const selectedFile = fileList[0];

        if (!scannerEngine) {
            scannerEngine = new Html5Qrcode("qr-reader-engine-canvas");
        }
        
        // Feed file directly into image processing algorithm
        scannerEngine.scanFile(selectedFile, true)
            .then(decodedText => {
                document.getElementById("loading-wheel").style.display = "none";
                const address = decodedText.trim();
                if (address && !waypoints.some(wp => wp.address === address)) { 
                    geocodeAndAdd(address); 
                }
            })
            .catch(err => {
                document.getElementById("loading-wheel").style.display = "none";
                alert("Could not find a barcode. Ensure the code fills the center of your shot, has bright lighting, and is in sharp focus!");
            });
    }

    function geocodeAndAdd(address) {
        fetch(`https://openstreetmap.org{encodeURIComponent(address)}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const lat = parseFloat(data.lat); const lon = parseFloat(data.lon);
                    const marker = L.marker([lat, lon]).addTo(map).bindPopup(address);
                    waypoints.push({ address: address, lat: lat, lon: lon, marker: marker });
                    saveWaypointsToDevice();
                    updateUI();
                    drawRouteLines();
                } else {
                    alert(`Address lookup failed for text: "${address}"`);
                }
            }).catch(err => console.error(err));
    }

    function saveWaypointsToDevice() {
        const cleanData = waypoints.map(wp => ({ address: wp.address, lat: wp.lat, lon: wp.lon }));
        localStorage.setItem("saved_waypoints", JSON.stringify(cleanData));
    }

    function loadSavedWaypoints() {
        const saved = localStorage.getItem("saved_waypoints");
        if (saved) {
            const parsed = JSON.parse(saved);
            parsed.forEach(wp => {
                const marker = L.marker([wp.lat, wp.lon]).addTo(map).bindPopup(wp.address);
                waypoints.push({ address: wp.address, lat: wp.lat, lon: wp.lon, marker: marker });
            });
            updateUI();
            drawRouteLines();
        }
    }

    function updateUI() {
        const list = document.getElementById("address-list");
        list.innerHTML = "";
        if (waypoints.length === 0) {
            list.innerHTML = `<li style="background:none; color:#888;">Queue empty. Tap the button above to snap a barcode photo.</li>`;
            return;
        }
        waypoints.forEach((wp, idx) => {
            list.innerHTML += `<li><span class="badge">Stop ${idx + 1}</span> ${wp.address}</li>`;
        });
        const allMarkers = waypoints.map(wp => wp.marker).filter(m => m !== null);
        if (allMarkers.length > 0) { map.fitBounds(new L.featureGroup(allMarkers).getBounds().pad(0.1)); }
    }

    function autoSortRoute() {
        if (waypoints.length < 1) return;
        let currentOrigin = userLocation || { lat: waypoints.lat, lon: waypoints.lon };
        let unvisited = [...waypoints]; let sortedArray = [];

        while (unvisited.length > 0) {
            let closestIdx = 0; let minDistance = Infinity;
            for (let i = 0; i < unvisited.length; i++) {
                let dist = Math.sqrt(Math.pow(unvisited[i].lat - currentOrigin.lat, 2) + Math.pow(unvisited[i].lon - currentOrigin.lon, 2));
                if (dist < minDistance) { minDistance = dist; closestIdx = i; }
            }
            currentOrigin = unvisited[closestIdx];
            sortedArray.push(unvisited.splice(closestIdx, 1));
        }
        waypoints = sortedArray;
        saveWaypointsToDevice();
        updateUI();
        drawRouteLines();
    }

    function drawRouteLines() {
        if (polylineRoute) { map.removeLayer(polylineRoute); }
        let pathPoints = waypoints.map(wp => [wp.lat, wp.lon]);
        if (userLocation) { pathPoints.unshift([userLocation.lat, userLocation.lon]); }
        polylineRoute = L.polyline(pathPoints, {color: '#2563eb', weight: 4}).addTo(map);
    }

    function exportToNativeMaps() {
        if (waypoints.length === 0) { alert("No addresses ready to map."); return; }
        const isApple = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        if (isApple) {
            let url = `http://apple.com`;
