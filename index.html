<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Route Scanner (Interactive Live UI)</title>
    <!-- Include Standard HTML5 Barcode Streaming Engine -->
    <script src="https://unpkg.com"></script>
    <!-- Include Open-Source Mapping Libraries -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 12px; background: #f8fafc; }
        h2 { color: #0f172a; margin-top: 5px; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        
        /* THE SCANNER DASHBOARD CARD CONTAINER */
        .scanner-card { background: white; padding: 16px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); margin-bottom: 12px; text-align: center; }
        
        /* INTERACTIVE STEP-BY-STEP UI PROMPT PANEL */
        #ui-prompt-box { background: #f0fdf4; border: 1px dashed #16a34a; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
        #prompt-title { font-weight: bold; color: #14532d; font-size: 15px; margin: 0 0 4px 0; }
        #prompt-desc { color: #166534; font-size: 12px; margin: 0; line-height: 1.4; }

        /* LIVE VIEWFINDER SCREEN CANVAS */
        #reader-wrapper { width: 100%; border-radius: 12px; overflow: hidden; display: none; position: relative; background: black; margin-top: 10px; }
        #reader { width: 100%; min-height: 250px; }
        
        /* LIVE LASER TARGET CROSSHAIR OVERLAY */
        .scanner-crosshairs { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; }
        .laser-grid { width: 240px; height: 160px; border: 2px dashed #00ffcc; border-radius: 8px; position: relative; box-shadow: 0 0 12px rgba(0,255,204,0.3); }
        .laser-grid::before { content: ''; position: absolute; top: 50%; left: -10px; right: -10px; height: 2px; background: rgba(255,0,0,0.6); transform: translateY(-50%); }

        #map { height: 250px; width: 100%; border-radius: 16px; margin-top: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .container { display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 16px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        button { border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-blue { background: #2563eb; color: white; }
        .btn-orange { background: #ea580c; color: white; font-size: 16px; padding: 16px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-green { background: #16a34a; color: white; grid-column: span 2; }
        .btn-danger { background: #ef4444; color: white; }
        ul { padding-left: 0; margin: 10px 0; list-style-type: none; max-height: 150px; overflow-y: auto; }
        li { padding: 10px; background: #f1f5f9; border-radius: 8px; margin-bottom: 6px; font-size: 13px; color: #334155; text-align: left; }
        .badge { background: #cbd5e1; color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Router & Barcode Optimizer</h2>
    
    <!-- DYNAMIC ONBOARDING INTERFACE PROMPT PANEL -->
    <div id="ui-prompt-box">
        <p id="prompt-title">Step 1: Initialize System</p>
        <p id="prompt-desc">Tap the action button below to trigger your phone's native hardware barcode environment.</p>
    </div>

    <div class="scanner-card">
        <!-- SINGLE MASTER TRIGGER ACTION BUTTON -->
        <button id="master-scan-btn" class="btn-orange" onclick="handlePromptWorkflow()">⚡ Start Point & Scan</button>
        
        <!-- LIVE CAMERA CONTAINER CHASSIS -->
        <div id="reader-wrapper">
            <div id="reader"></div>
            <div class="scanner-crosshairs">
                <div class="laser-grid"></div>
            </div>
        </div>
    </div>
    
    <div class="card">
        <h3 style="margin-top:0; font-size: 16px; color: #1e293b;">Delivery Queue</h3>
        <ul id="address-list"></ul>
        
        <div class="grid-buttons">
            <button class="btn-blue" onclick="autoSortRoute()">Auto-Sort Stops</button>
            <button class="btn-danger" onclick="clearAllWaypoints()">Clear All</button>
            <button class="btn-green" onclick="exportToNativeMaps()">Launch Voice Turn-by-Turn</button>
        </div>
    </div>

    <div id="map"></div>
</div>

<script>
    let waypoints = [];
    let map;
    let polylineRoute = null;
    let userLocation = null;
    let html5QrCode = null;
    let currentStep = 1;

    function initMap() {
        map = L.map('map').setView([35.222, -101.831], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userLocation = { lat: position.coords.latitude, lon: position.coords.longitude };
                map.setView([userLocation.lat, userLocation.lon], 13);
                L.marker([userLocation.lat, userLocation.lon], {
                    icon: L.divIcon({className: 'user-icon', html: '📍', iconSize:})
                }).addTo(map).bindPopup("Current Position").openPopup();
                loadSavedWaypoints();
            }, () => { loadSavedWaypoints(); });
        } else {
            loadSavedWaypoints();
        }
    }
    initMap();

    // INTERACTIVE PROMPT STEERING ENGINE
    function handlePromptWorkflow() {
        const btn = document.getElementById("master-scan-btn");
        const promptTitle = document.getElementById("prompt-title");
        const promptDesc = document.getElementById("prompt-desc");
        const promptBox = document.getElementById("ui-prompt-box");

        if (currentStep === 1) {
            // STEP 1: Execute Native System Permissions Request Panel Channel
            promptTitle.innerText = "Step 2: Accept System Request";
            promptDesc.innerText = "Tap 'Allow' on your browser's security popup window to authorize the rear tracking camera lens.";
            promptBox.style.background = "#fffbeb";
            promptBox.style.borderColor = "#d97706";
            promptTitle.style.color = "#78350f";
            promptDesc.style.color = "#92400e";
            btn.innerText = "🔄 Connect Hardware Lens";
            currentStep = 2;
            
            // Fire native video permission sequence
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    stream.getTracks().forEach(track => track.stop()); // drop temporary link
                    // Auto advance step sequence on successful verification
                    currentStep = 2;
                    handlePromptWorkflow();
                })
                .catch(err => {
                    alert("Camera blocked. Please go into your smartphone's browser settings and check 'Allow Camera'.");
                    resetToStepOne();
                });
                
        } else if (currentStep === 2) {
            // STEP 2: Launch Shutter Lens Feed Canvas
            document.getElementById("reader-wrapper").style.display = "block";
            btn.innerText = "🛑 Stop Scanning Stream";
            btn.className = "btn-danger";
            
            promptTitle.innerText = "Step 3: Point At Barcode";
            promptDesc.innerText = "Position the barcode flat inside the dashed blue crosshairs box. It will read automatically.";
            promptBox.style.background = "#eff6ff";
            promptBox.style.borderColor = "#2563eb";
            promptTitle.style.color = "#1e3a8a";
            promptDesc.style.color = "#1e40af";
            
            currentStep = 3;
            startLiveStreamDecoder();
        } else if (currentStep === 3) {
            // STEP 3: User manually stops running lens stream
            stopLiveStreamDecoder();
            resetToStepOne();
        }
    }

    function resetToStepOne() {
        const btn = document.getElementById("master-scan-btn");
        const promptTitle = document.getElementById("prompt-title");
        const promptDesc = document.getElementById("prompt-desc");
        const promptBox = document.getElementById("ui-prompt-box");
        
        document.getElementById("reader-wrapper").style.display = "none";
        btn.innerText = "⚡ Start Point & Scan";
        btn.className = "btn-orange";
        
        promptTitle.innerText = "Step 1: Initialize System";
        promptDesc.innerText = "Tap the action button below to trigger your phone's native hardware barcode environment.";
        promptBox.style.background = "#f0fdf4";
        promptBox.style.borderColor = "#16a34a";
        promptTitle.style.color = "#14532d";
        promptDesc.style.color = "#166534";
        
        currentStep = 1;
    }

    function startLiveStreamDecoder() {
        if (!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); }
        
        const formats = [
            Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.DATA_MATRIX,
            Html5QrcodeSupportedFormats.PDF_417, Html5QrcodeSupportedFormats.CODE_128
        ];

        html5QrCode.start(
            { facingMode: "environment" },
