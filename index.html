<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Route Router Pro (Fail-Safe Edition)</title>
    <!-- Include QR/Barcode Scanner Library -->
    <script src="https://unpkg.com"></script>
    <!-- Include Open-Source Mapping Libraries -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 12px; background: #f8fafc; }
        h2 { color: #0f172a; margin-top: 5px; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        
        #scanner-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; display: none; }
        #reader { width: 100vw; height: 100vh; background: black; }
        .viewfinder-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; }
        .laser-box { width: 260px; height: 200px; border: 2px dashed #00ffcc; position: relative; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3), inset 0 0 20px rgba(0, 255, 204, 0.2); }
        .laser-box::before { content: ''; position: absolute; top: 50%; left: -10px; right: -10px; height: 2px; background: rgba(255, 50, 50, 0.6); transform: translateY(-50%); }
        .laser-box::after { content: ''; position: absolute; left: 50%; top: -10px; bottom: -10px; width: 2px; background: rgba(255, 50, 50, 0.4); transform: translateX(-50%); }
        .scanner-instruction { color: #ffffff; font-weight: bold; font-size: 14px; margin-top: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); text-align: center; }
        .cancel-scan-wrapper { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; pointer-events: auto; }

        #map { height: 260px; width: 100%; border-radius: 16px; margin-top: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .container { display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 16px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        button { border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-blue { background: #2563eb; color: white; }
        .btn-orange { background: #ea580c; color: white; font-size: 16px; padding: 16px; width: 100%; max-width: 500px; margin: 0 auto; display: block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; text-decoration: none; }
        .btn-green { background: #16a34a; color: white; grid-column: span 2; }
        .btn-danger { background: #ef4444; color: white; }
        ul { padding-left: 0; margin: 10px 0; list-style-type: none; max-height: 180px; overflow-y: auto; }
        li { padding: 10px; background: #f1f5f9; border-radius: 8px; margin-bottom: 6px; font-size: 13px; color: #334155; display: flex; align-items: center; }
        .badge { background: #cbd5e1; color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 8px; font-weight: bold; }
        .status-banner { background: #f0fdf4; color: #16a34a; padding: 8px; border-radius: 8px; font-size: 12px; text-align: center; font-weight: bold; margin-bottom: 5px; border: 1px solid #bbf7d0; }
        
        /* Hidden file catcher input */
        #fallback-file-input { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Router & Barcode Optimizer</h2>
    <div class="status-banner">✅ Direct Mode Active (Fail-Safe Enabled)</div>
    
    <!-- MAIN INTERACTIVE TRIGGER BUTTON -->
    <button id="scan-trigger-btn" class="btn-orange" onclick="activateSmartScanner()">📷 Scan Barcode / Take Photo</button>
    
    <!-- NATIVE PHONE CAMERA CAPTURE FALLBACK (Hidden input field) -->
    <input type="file" id="fallback-file-input" accept="image/*" capture="environment" onchange="processCapturedPhoto(event)">

    <!-- Full screen viewport crosshair system -->
    <div id="scanner-container">
        <div id="reader"></div>
        <div class="viewfinder-overlay">
            <div class="laser-box"></div>
            <div class="scanner-instruction">Center Barcode Inside Crosshairs</div>
            <div class="cancel-scan-wrapper">
                <button class="btn-danger" style="width: 150px;" onclick="stopManualScanner()">Cancel Scan</button>
            </div>
        </div>
    </div>
    
    <div class="card">
        <h3 style="margin-top:0; font-size: 16px; color: #1e293b;">Delivery Queue</h3>
        <ul id="address-list"></ul>
        
        <div class="grid-buttons">
            <button class="btn-blue" onclick="autoSortRoute()">Auto-Sort Stops</button>
            <button class="btn-danger" onclick="clearAllWaypoints()">Clear All</button>
            <button class="btn-green" onclick="exportToNativeMaps()">Launch Voice Turn-by-Turn</button>
        </div>
    </div>

    <div id="map"></div>
</div>

<script>
    let waypoints = [];
    let map;
    let polylineRoute = null;
    let userLocation = null;
    let html5QrCode = null;

    function initMap() {
        map = L.map('map').setView([35.222, -101.831], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userLocation = { lat: position.coords.latitude, lon: position.coords.longitude };
                map.setView([userLocation.lat, userLocation.lon], 13);
                L.marker([userLocation.lat, userLocation.lon], {
                    icon: L.divIcon({className: 'user-icon', html: '📍', iconSize:})
                }).addTo(map).bindPopup("Current Starting Position").openPopup();
                loadSavedWaypoints();
            }, () => { loadSavedWaypoints(); });
        } else {
            loadSavedWaypoints();
        }
    }
    initMap();

    // SMART SCANNER ROUTER LOGIC
    function activateSmartScanner() {
        document.getElementById("scanner-container").style.display = "block";
        if (!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); }

        // Attempt live hardware crosshair scan stream
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 15, qrbox: { width: 260, height: 200 } },
            (decodedText) => {
                const address = decodedText.trim();
                stopManualScanner();
                if (address && !waypoints.some(wp => wp.address === address)) { geocodeAndAdd(address); }
            },
            (errorMessage) => {}
        ).catch(err => {
            // IF VIDEO STREAM BLOCKED: Silently bypass error screen and fire phone camera app!
            console.log("Video feed blocked. Launching hardware snapshot fallback app channel.");
            stopManualScanner();
            document.getElementById("fallback-file-input").click();
        });
    }

    // STATIC PHOTO PROCESSING ENGINE (Bypasses all permission blocks)
    function processCapturedPhoto(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); }
        
        // Scan the static camera image for any 1D or 2D barcodes
        html5QrCode.scanFile(file, true)
            .then(decodedText => {
                const address = decodedText.trim();
                if (address && !waypoints.some(wp => wp.address === address)) { geocodeAndAdd(address); }
            })
            .catch(err => {
                alert("Could not detect a barcode in that photo. Make sure the light is bright and the code is clear!");
            });
    }

    function stopManualScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                document.getElementById("scanner-container").style.display = "none";
            }).catch(err => console.error(err));
        } else {
            document.getElementById("scanner-container").style.display = "none";
        }
    }

    function geocodeAndAdd(address) {
        fetch(`https://openstreetmap.org{encodeURIComponent(address)}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const lat = parseFloat(data.lat); const lon = parseFloat(data.lon);
                    const marker = L.marker([lat, lon]).addTo(map).bindPopup(address);
                    waypoints.push({ address: address, lat: lat, lon: lon, marker: marker });
                    saveWaypointsToDevice();
                    updateUI();
                    drawRouteLines();
                } else {
                    alert(`Address lookup failed for text: "${address}"`);
                }
            }).catch(err => console.error(err));
    }

    function saveWaypointsToDevice() {
        const cleanData = waypoints.map(wp => ({ address: wp.address, lat: wp.lat, lon: wp.lon }));
        localStorage.setItem("saved_waypoints", JSON.stringify(cleanData));
    }

    function loadSavedWaypoints() {
        const saved = localStorage.getItem("saved_waypoints");
        if (saved) {
            const parsed = JSON.parse(saved);
            parsed.forEach(wp => {
