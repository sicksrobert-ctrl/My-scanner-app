<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Route Router (Instant Clean Load)</title>
    <!-- Include Open-Source Mapping Libraries -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 12px; background: #f8fafc; }
        h2 { color: #0f172a; margin-top: 5px; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        
        .scanner-card { background: white; padding: 16px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); margin-bottom: 12px; text-align: center; }
        
        /* DIRECT NATIVE VIDEO HOUSING */
        #video-preview-window { width: 100%; height: 240px; background: black; border-radius: 12px; display: none; object-fit: cover; margin-top: 10px; }
        
        #map { height: 260px; width: 100%; border-radius: 16px; margin-top: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .container { display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 16px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        button { border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-blue { background: #2563eb; color: white; }
        .btn-orange { background: #ea580c; color: white; font-size: 16px; padding: 16px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-green { background: #16a34a; color: white; grid-column: span 2; }
        .btn-danger { background: #ef4444; color: white; }
        ul { padding-left: 0; margin: 10px 0; list-style-type: none; max-height: 150px; overflow-y: auto; }
        li { padding: 10px; background: #f1f5f9; border-radius: 8px; margin-bottom: 6px; font-size: 13px; color: #334155; text-align: left; }
        .badge { background: #cbd5e1; color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 8px; font-weight: bold; }
        .input-bar { display: flex; gap: 8px; margin-top: 10px; }
        .text-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Router & Barcode Optimizer</h2>

    <div class="scanner-card">
        <!-- SIMPLIFIED DIRECT CAM ACTION BUTTON -->
        <button id="camera-launcher-btn" class="btn-orange" onclick="fireNativeMobileCamera()">📷 Turn On Scanner Lens</button>
        
        <!-- NATIVE HARDWARE STREAM VIEWER -->
        <video id="video-preview-window" autoplay playsinline></video>
        
        <!-- BACKUP TEXT ENTRY BAR -->
        <div class="input-bar">
            <input type="text" id="manual-address-input" class="text-input" placeholder="Type address manually if camera fails...">
            <button class="btn-blue" style="width: auto; padding: 12px 18px;" onclick="handleManualSubmit()">Add</button>
        </div>
    </div>
    
    <div class="card">
        <h3 style="margin-top:0; font-size: 16px; color: #1e293b;">Delivery Queue</h3>
        <ul id="address-list"></ul>
        
        <div class="grid-buttons">
            <button class="btn-blue" onclick="autoSortRoute()">Auto-Sort Stops</button>
            <button class="btn-danger" onclick="clearAllWaypoints()">Clear All</button>
            <button class="btn-green" onclick="exportToNativeMaps()">Launch Voice Turn-by-Turn</button>
        </div>
    </div>

    <div id="map"></div>
</div>

<script>
    let waypoints = [];
    let map;
    let polylineRoute = null;
    let userLocation = null;
    let activeStream = null;

    function initMap() {
        map = L.map('map').setView([35.222, -101.831], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userLocation = { lat: position.coords.latitude, lon: position.coords.longitude };
                map.setView([userLocation.lat, userLocation.lon], 13);
                L.marker([userLocation.lat, userLocation.lon], {
                    icon: L.divIcon({className: 'user-icon', html: '📍', iconSize:})
                }).addTo(map).bindPopup("Current Position").openPopup();
                loadSavedWaypoints();
            }, () => { loadSavedWaypoints(); });
        } else {
            loadSavedWaypoints();
        }
    }
    initMap();

    // BULLETPROOF DIRECT HARDWARE DISPATCH HANDLER
    function fireNativeMobileCamera() {
        const videoElement = document.getElementById("video-preview-window");
        const triggerBtn = document.getElementById("camera-launcher-btn");

        if (activeStream) {
            // If lens stream is running, tap turns it off smoothly
            stopCameraStream();
            return;
        }

        // Standard web constraint structure used by software developers globally
        const hardwareConstraints = {
            video: {
                facingMode: "environment", // Strips out front lenses, opens back lens directly
                width: { ideal: 640 },
                height: { ideal: 480 }
            }
        };

        // Fire direct, library-free device media handshake
        navigator.mediaDevices.getUserMedia(hardwareConstraints)
            .then(stream => {
                activeStream = stream;
                videoElement.srcObject = stream;
                videoElement.style.display = "block";
                triggerBtn.innerText = "🛑 Stop Camera Feed";
                triggerBtn.style.background = "#ef4444";
                
                // Simulate reading a barcode via an alert to verify video feed capability
                setTimeout(() => {
                    alert("Camera lens verified! The camera stream is running smoothly on your screen.");
                }, 1500);
            })
            .catch(error => {
                console.error("Hardware error:", error);
                alert("Camera Blocked! Please go to your phone settings -> Safari/Chrome -> Camera -> Allow.");
            });
    }

    function stopCameraStream() {
        const videoElement = document.getElementById("video-preview-window");
        const triggerBtn = document.getElementById("camera-launcher-btn");
        
        if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
            activeStream = null;
        }
        videoElement.style.display = "none";
        triggerBtn.innerText = "📷 Turn On Scanner Lens";
        triggerBtn.style.background = "#ea580c";
    }

    function handleManualSubmit() {
        const input = document.getElementById("manual-address-input");
        const text = input.value.trim();
        if (text) {
            geocodeAndAdd(text);
            input.value = "";
        }
    }

    function geocodeAndAdd(address) {
        fetch(`https://openstreetmap.org{encodeURIComponent(address)}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const lat = parseFloat(data.lat); const lon = parseFloat(data.lon);
                    const marker = L.marker([lat, lon]).addTo(map).bindPopup(address);
                    waypoints.push({ address: address, lat: lat, lon: lon, marker: marker });
                    saveWaypointsToDevice();
                    updateUI();
                    drawRouteLines();
                } else {
                    alert(`Address lookup failed for text: "${address}"`);
                }
            }).catch(err => console.error(err));
    }

    function saveWaypointsToDevice() {
        const cleanData = waypoints.map(wp => ({ address: wp.address, lat: wp.lat, lon: wp.lon }));
        localStorage.setItem("saved_waypoints", JSON.stringify(cleanData));
    }

    function loadSavedWaypoints() {
        const saved = localStorage.getItem("saved_waypoints");
        if (saved) {
            const parsed = JSON.parse(saved);
            parsed.forEach(wp => {
                const marker = L.marker([wp.lat, wp.lon]).addTo(map).bindPopup(wp.address);
                waypoints.push({ address: wp.address, lat: wp.lat, lon: wp.lon, marker: marker });
            });
            updateUI();
            drawRouteLines();
        }
    }

    function updateUI() {
        const list = document.getElementById("address-list");
        list.innerHTML = "";
        if (waypoints.length === 0) {
            list.innerHTML = `<li style="background:none; color:#888;">Queue empty. Use camera lens or manual search tool.</li>`;
            return;
        }
        waypoints.forEach((wp, idx) => {
            list.innerHTML += `<li><span class="badge">Stop ${idx + 1}</span> ${wp.address}</li>`;
        });
        const allMarkers = waypoints.map(wp => wp.marker).filter(m => m !== null);
        if (allMarkers.length > 0) { map.fitBounds(new L.featureGroup(allMarkers).getBounds().pad(0.1)); }
    }

    function autoSortRoute() {
        if (waypoints.length < 1) return;
        let currentOrigin = userLocation || { lat: waypoints.lat, lon: waypoints.lon };
        let unvisited = [...waypoints]; let sortedArray = [];

        while (unvisited.length > 0) {
            let closestIdx = 0; let minDistance = Infinity;
            for (let i = 0; i < unvisited.length; i++) {
